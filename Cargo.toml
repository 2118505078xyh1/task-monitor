[package]
name = "resmon"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
description = "任务监控（原 ResMon）— 桌面资源小挂件 (iced)"
license = "MIT"
publish = false

[lib]
name = "resmon"
path = "src/lib.rs"

# GUI：不带控制台窗口
[[bin]]
name = "resmon"
path = "src/main.rs"

[[bin]]
name = "resmon-dump"
path = "src/bin/resmon-dump.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "crisp"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
